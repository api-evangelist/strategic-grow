description: Revolution Precrafted is a Manila, Philippines-based prefabricated design
  and proptech company founded in 2015 by Robbie Antonio. It designs and sells limited-edition
  prefab homes, pavilions, modular hotels, pop-up retail spaces, glamping structures,
  and furniture created by more than 80 leading global architects, designers, and artists
  under exclusive partnership. Backed by 500 Startups (500 Durians) and K2 Global, it
  reached a reported unicorn valuation. The company runs a consumer real-estate and
  construction business and publishes no public API, developer portal, SDK, or technical
  documentation. Surfaced as a 500 Global portfolio lead and mislabeled "Strategic Grow"
  in the source stub; the website revolutionprecrafted.com is authoritative.
